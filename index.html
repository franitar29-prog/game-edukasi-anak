<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Petualangan Geometri</title><style>*{box-sizing:border-box;margin:0;font-family:"Segoe UI",Nunito,Arial,sans-serif}
body{background:#1b3a6b;display:flex;justify-content:center}
#app{position:relative;width:100%;max-width:480px;height:100vh;overflow:hidden;background:linear-gradient(#6cc0f5,#bfe6ff 60%,#e8f6ff)}
#screen{position:absolute;inset:0;overflow-y:auto;padding-bottom:110px}
#stage{position:relative;transform-origin:0 0;width:820px;height:1520px}
.isl{position:absolute}.isl img{width:100%;display:block}
.node{position:absolute;width:13.5%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:4px solid #dfe8f5;color:#fff;font-weight:800;font-size:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:radial-gradient(#5d7699,#2c4467);box-shadow:0 4px 8px #0006}
.node.open{background:radial-gradient(#3b9cff,#0a4fc4);border-color:#ffd24a;animation:p 1.2s infinite}
.node.done{background:radial-gradient(#ffd75a,#e59a00);border-color:#fff}
.node small{position:absolute;top:-24px;font-size:18px;color:#ffc400;text-shadow:0 1px 2px #000;white-space:nowrap}
@keyframes p{50%{transform:translate(-50%,-50%) scale(1.1)}}
#hud{position:absolute;top:0;left:0;right:0;padding:8px;display:flex;gap:6px;align-items:center;justify-content:space-between;pointer-events:none}
.pill{background:#14407a;color:#fff;border-radius:22px;padding:6px 12px;font-weight:700;display:flex;gap:6px;align-items:center;font-size:14px}
.pill img{width:32px;height:32px;border-radius:50%;background:#fff}
.bar{height:8px;background:#0a2a55;border-radius:6px;overflow:hidden;width:90px}.bar i{display:block;height:100%;background:#7bd34a}
#nav{position:absolute;bottom:8px;left:8px;right:8px;background:#fffd;border-radius:26px;display:flex;justify-content:space-around;padding:6px;box-shadow:0 4px 14px #0004}
#nav button{border:0;background:0;display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:700;color:#35517f;padding:4px 8px;border-radius:16px;cursor:pointer}
#nav button.on{background:#d6e8ff;color:#0a58d6}#nav img{height:44px}
.card{background:#fffe;margin:12px;padding:16px;border-radius:18px;color:#16335f;box-shadow:0 3px 10px #0003}
.pad{padding-top:70px}.card h2{margin-bottom:8px}.card p{line-height:1.5}
.btn{background:linear-gradient(#59d36b,#25a244);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:800;cursor:pointer;margin:4px}
.btn.g{background:linear-gradient(#8aa0c4,#5b7299)}
.opt{display:block;width:100%;margin:8px 0;padding:14px;border-radius:14px;border:3px solid #9cc2f5;background:#fff;font-size:17px;font-weight:700;color:#16335f;cursor:pointer}
.opt.ok{background:#b8f0bf;border-color:#2aa84a}.opt.no{background:#ffc4c4;border-color:#d33}
#modal{position:absolute;inset:0;background:#0007;z-index:9;overflow:auto;padding-top:30px}.hide{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap}.badge{flex:1 1 40%;text-align:center;padding:10px;border-radius:14px;background:#eef5ff}.badge.off{opacity:.4;filter:grayscale(1)}
.big{font-size:40px;text-align:center}input{padding:10px;border-radius:10px;border:2px solid #9cc2f5;font-size:16px;width:100%}
/* ===== Tampilan baru ===== */
#modal{background:linear-gradient(#6cc0f5,#cfeaff 70%,#f2faff);padding:0;z-index:9}
.dt{padding:14px;text-align:center;color:#16335f;min-height:100%}
.ttl{font-size:34px;font-weight:900;color:#fff;background:linear-gradient(#c8792a,#8f4a14);border-radius:14px;padding:6px 24px;display:inline-block;margin:8px 0;text-shadow:0 2px 0 #5a2d08}
.sub{background:#17469a;color:#fff;border-radius:10px;padding:4px 14px;display:table;margin:0 auto 10px;font-weight:700}
.back{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#1c6fe0;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 2px 6px #0004;float:left;z-index:5}
.chips{display:flex;gap:8px;justify-content:center;margin:8px 0}.chips span{background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.hero{width:150px;display:block;margin:6px auto}
.go{display:block;width:100%;border:0;border-radius:30px;padding:16px;font-size:24px;font-weight:900;color:#16335f;background:linear-gradient(#ffe066,#ffb300);box-shadow:0 4px 0 #c78100;cursor:pointer;margin:10px 0}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:10px}.qtop .back{float:none;flex:none}
.opt.c0{background:#ffe27a;border-color:#f2b705}.opt.c1{background:#cfe3ff;border-color:#4b8dff}.opt.c2{background:#cdf2c8;border-color:#52b948}.opt.c3{background:#ffd3e1;border-color:#ff7fa6}
.opt.ok{background:#8de08f!important;border-color:#1f9d3f!important}.opt.no{background:#ff9d9d!important;border-color:#d22!important}
.opt{text-align:left;font-size:18px}
.home{position:relative;margin-top:110px}.home img{width:100%;display:block;-webkit-mask-image:linear-gradient(transparent,#000 10%);mask-image:linear-gradient(transparent,#000 10%)}
.hot{position:absolute;left:22%;width:56%;top:40.5%;height:11.5%;background:0;border:0;cursor:pointer;border-radius:40px}
.misi{position:absolute;right:8px;width:170px;background:#fffe;border-radius:14px;padding:8px;font-size:13px;color:#16335f;z-index:3;box-shadow:0 2px 8px #0003}
.ban{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:60%;pointer-events:none}
.koleksi{position:absolute;left:8px;bottom:120px;background:#fffe;border-radius:16px;padding:8px 12px;display:flex;gap:8px;align-items:center;color:#16335f;font-size:13px;z-index:3;cursor:pointer}
#hud{z-index:4}.pill{font-size:13px;padding:5px 9px}.pill.prof{border-radius:22px}.pill small{opacity:.8}.plus{background:#4cc95a;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center}

.gm{position:relative;max-width:440px;margin:auto;padding:8px;color:#16335f}.gtop{display:flex;align-items:center;gap:10px;background:#14407a;color:#fff;border-radius:22px;padding:6px 10px;margin-bottom:8px;font-size:14px}.gtop .back{float:none;width:38px;height:38px;font-size:16px}
canvas{width:100%;display:block;border-radius:20px;border:3px solid #fff;background:linear-gradient(#6cc0f5,#e3f4ff)}
.ctl{display:flex;justify-content:space-between;margin-top:8px}.ctl button{width:30%;height:56px;border-radius:30px;border:3px solid #fff;background:#1c6fe0;color:#fff;font-size:28px;font-weight:900;touch-action:none;cursor:pointer}
.qo{position:absolute;inset:0;background:#0007;display:flex;align-items:center;padding:12px;border-radius:20px}.qo.hide{display:none}
.og{display:grid;grid-template-columns:1fr 1fr;gap:8px}.og .opt{text-align:center;margin:0}

/* ===== Awan bergerak (latar semua layar) ===== */
#clouds{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#clouds i{position:absolute;left:-220px;width:130px;height:38px;background:#fff;border-radius:40px;opacity:.9;animation:drift linear infinite}
#clouds i::before,#clouds i::after{content:"";position:absolute;background:#fff;border-radius:50%}
#clouds i::before{width:56px;height:56px;left:22px;top:-26px}#clouds i::after{width:44px;height:44px;left:64px;top:-16px}
#clouds i:nth-child(1){top:12%;animation-duration:38s}#clouds i:nth-child(2){top:30%;transform:scale(1.4);animation-duration:55s;animation-delay:-20s}
#clouds i:nth-child(3){top:52%;animation-duration:44s;animation-delay:-30s}#clouds i:nth-child(4){top:70%;transform:scale(1.2);animation-duration:62s;animation-delay:-8s}
#clouds i:nth-child(5){top:86%;animation-duration:48s;animation-delay:-35s}
@keyframes drift{to{left:110%}}
#screen{z-index:1}#modal{background:transparent!important}
#app:has(#modal:not(.hide)) #screen{visibility:hidden}
</style></head>

const ICON=["14_nav_home","15_nav_map","16_nav_achievements","17_nav_materials","18_nav_profile"],ACT=["19_nav_home","20_nav_map","21_nav_achievements","22_nav_materials","23_nav_profile"],LBL=["Beranda","Peta","Prestasi","Materi","Profil"],TAB=["home","map","ach","mat","prof"];
// ===== STATE (data pemain, disimpan di localStorage) =====
let S=JSON.parse((()=>{try{return localStorage.getItem("geo")}catch(e){return null}})()||"null")||{name:"Rizki",xp:0,star:0,gem:0,lv:{},mis:0},tab="home";
const save=()=>{try{localStorage.setItem("geo",JSON.stringify(S))}catch(e){}},$=id=>document.getElementById(id);
const lvl=()=>1+Math.floor(S.xp/100),done=()=>Object.keys(S.lv).length;
const unlocked=i=>i==1||S.lv[i-1]!==undefined;           // level terbuka jika level sebelumnya selesai
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
// ===== MUSIK & EFEK SUARA (dibuat dengan Web Audio, tanpa file mp3) =====
let AC,mt,mi=0,mute=false;try{mute=localStorage.getItem("geoMute")=="1"}catch(e){}
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state=="suspended")AC.resume();return AC}
function tone(f,d,type="sine",v=.08,t0=0){const a=ac();if(!a||mute)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}
const sfx={coin:()=>{tone(988,.08,"square",.05);tone(1319,.15,"square",.05,.08)},jump:()=>tone(440,.15,"triangle",.07),ok:()=>[523,659,784].forEach((f,i)=>tone(f,.2,"triangle",.09,i*.1)),no:()=>{tone(220,.25,"sawtooth",.05);tone(165,.3,"sawtooth",.05,.15)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",.09,i*.12))};
const MEL=[523,587,659,784,659,587,523,392,523,659,784,880,784,659,587,523],BAS=[131,131,196,196,175,175,196,196]; // melodi ceria berulang
function startAudio(){ac();if(!mt)mt=setInterval(()=>{if(mute||!AC)return;tone(MEL[mi%16],.28,"triangle",.045);if(mi%2==0)tone(BAS[(mi/2)%8|0],.45,"sine",.05);mi++},300)}
function toggleSound(){mute=!mute;try{localStorage.setItem("geoMute",mute?"1":"0")}catch(e){}hud();return mute}
addEventListener("pointerdown",startAudio);addEventListener("keydown",startAudio);
// ===== KOMPONEN TAMPILAN =====
function hud(){$("hud").innerHTML=`<div class="pill prof"><img src="${IMG["avatar.png"]}"><div><small>Siswa</small><br><b>${S.name}</b><div class="bar"><i style="width:${S.xp%100}%"></i></div><small>Level ${lvl()}</small></div></div><div class="pill">⭐ ${S.star}<span class="plus">+</span></div><div class="pill">💎 ${S.gem}<span class="plus">+</span></div><div class="pill" onclick="toggleSound()" style="pointer-events:auto">${mute?"🔇":"🔊"}</div>`}
function nav(){$("nav").innerHTML=TAB.map((t,i)=>`<button class="${t==tab?"on":""}" onclick="go('${t}')"><img src="${IMG[`${(t==tab?ACT:ICON)[i]}.png`]}" onerror="this.outerHTML='<b>${LBL[i]}</b>'"></button>`).join("")}
const misi=top=>`<div class="misi" style="top:${top}px"><b>Misi Hari Ini</b><br><small>Selesaikan 3 level dengan nilai sempurna</small><div class="bar" style="width:100%;margin-top:4px"><i style="width:${S.mis/3*100}%"></i></div><small>${S.mis}/3</small></div>`;
const closeM=()=>{if(G)G.run=0;$("modal").classList.add("hide");render()};
const go=t=>{tab=t;render()};
// ===== HALAMAN UTAMA (router tab) =====
function render(){hud();nav();const s=$("screen");s.scrollTop=0;
 if(tab=="home")s.innerHTML=`<div class="home"><img src="${IMG["home_bg.jpg"]}"><button class="hot" onclick="go('map')" aria-label="Mulai Petualangan"></button></div>${misi(70)}`;
 if(tab=="map")return map(s);
 if(tab=="ach"){const b=[["🌱","Langkah Pertama",done()>=1],["🏝️","Tamat Pulau Bentuk",[1,2,3,4,5,6].every(i=>S.lv[i]!==undefined)],["⭐","Kumpul 100 Bintang",S.star>=100],["💎","Kumpul 20 Berlian",S.gem>=20],["🏆","10 Level Selesai",done()>=10],["👑","Raja Geometri",done()>=30]];
  s.innerHTML=`<div class="pad"><div class="card"><h2>🏆 Prestasi</h2><div class="row">${b.map(x=>`<div class="badge ${x[2]?"":"off"}"><div class="big">${x[0]}</div>${x[1]}</div>`).join("")}</div></div></div>`}
 if(tab=="mat")s.innerHTML=`<div class="pad">${W.map((w,i)=>`<div class="card"><h2>${i+1}. ${w.n}</h2><p>${w.mat}</p></div>`).join("")}</div>`;
 if(tab=="prof")s.innerHTML=`<div class="pad"><div class="card"><h2>👤 Profil</h2><p>Nama pemain:</p><input id="nm" value="${S.name}" maxlength="14"><button class="btn" onclick="S.name=$('nm').value||'Siswa';save();render()">Simpan</button><p>Level ${lvl()} · XP ${S.xp} · ⭐ ${S.star} · 💎 ${S.gem}</p><p>Koleksi bentuk: ${Math.min(24,done())}/24</p><button class="btn g" onclick="if(true){try{localStorage.removeItem('geo')}catch(e){}location.reload()}">Reset Progres</button></div></div>`}
// ===== PETA PETUALANGAN =====
function nodes(wi,stop){const w=W[wi];return w.pos.map((p,k)=>{const i=wi*6+k+1,d=S.lv[i],c=d!==undefined?"done":unlocked(i)?"open":"";
 return `<div class="node ${c}" style="left:${p[0]/w.w*100}%;top:${p[1]/w.h*100}%" onclick="${stop?"event.stopPropagation();":""}detail(${i})">${d!==undefined?`<small>${"★".repeat(d)}${"☆".repeat(3-d)}</small>`:""}${c?i:"🔒"}</div>`}).join("")}
function map(s){let h="";
 W.forEach((w,wi)=>{h+=`<div class="isl" style="left:${w.x}px;top:${w.y}px;width:${w.w}px" onclick="world(${wi})"><img src="${IMG[`${w.img}.png`]}">${nodes(wi,1)}</div>`});
 s.innerHTML=`<div id="stage">${h}</div><button class="back" style="position:absolute;top:84px;left:10px" onclick="go('home')">‹</button><img src="${IMG["05_map_title_banner.png"]}" class="ban">${misi(150)}<div class="koleksi" onclick="go('prof')">🧰 <div><b>Koleksi Bentuk</b><div class="bar" style="width:100px"><i style="width:${Math.min(24,done())/24*100}%"></i></div></div> ${Math.min(24,done())}/24</div>`;
 const f=Math.min(1,s.clientWidth/820);$("stage").style.transform=`scale(${f})`;$("stage").style.height=1520*f+"px"}
// ===== LAYAR PULAU (zoom satu dunia) =====
function world(wi){const w=W[wi];$("screen").innerHTML=`<div style="padding-top:70px"><button class="back" style="position:absolute;top:70px;left:10px;z-index:5" onclick="go('map')">‹</button><div class="isl" style="position:relative;width:100%;margin-top:30px"><img src="${IMG[`${w.img}.png`]}">${nodes(wi,0)}</div><div class="card" style="text-align:center"><b>${w.n}</b><br>Pilih level untuk mulai menjelajah</div></div>`}
// ===== DETAIL LEVEL =====
let Q,qi,ok,cur;
function detail(i){if(!unlocked(i))return toast("Selesaikan level sebelumnya dulu ya! 🔒");cur=i;const w=W[Math.floor((i-1)/6)],d=S.lv[i]||0;
 $("modal").classList.remove("hide");
 $("modal").innerHTML=`<div class="dt"><button class="back" onclick="closeM()">‹</button><div class="ttl">Level ${i}</div><div class="sub">${w.n}</div><div class="card"><b>Tujuan:</b><br>${w.mat.split(". ")[0]}.</div><div class="big" style="color:#ffc400">${"★".repeat(d)}<span style="color:#fff">${"★".repeat(3-d)}</span></div><div class="chips"><span>⏱ 3–5 menit</span><span>🎯 5 tantangan</span></div><img src="${IMG["27_triangle_hero_map_crop.png"]}" class="hero"><button class="go" onclick="explore()">Mulai</button></div>`}
// ===== MINI-GAME PLATFORM + SOAL =====
let G,T=0;const HI=new Image();HI.src=`${IMG["27_triangle_hero_map_crop.png"]}`;
const EM={};
function explore(){const w=W[Math.floor((cur-1)/6)];Q=shuf(w.q).slice(0,5);qi=0;ok=0;
 G={x:40,y:440,vx:0,vy:0,ledge:0,hearts:3,coin:0,col:0,asked:{},pause:0,run:1,keys:{l:0,r:0},
  L:[[0,440,110],[120,380,70],[215,320,70],[100,255,70],[10,190,70],[110,125,90]], // [x,y,lebar] tiap pijakan
  I:[[155,360,"t"],[250,300,"s"],[145,105,"c"],[60,415,"o"],[240,370,"o"],[45,170,"o"],[135,235,"o"],[80,405,"o"],[190,345,"o"],[270,290,"o"],[200,235,"o"],[150,215,"o"],[40,150,"o"],[90,150,"o"],[190,95,"o"],[100,335,"o"],[60,335,"o"]]}; // benda: t=segitiga s=persegi c=lingkaran o=koin
 $("modal").classList.remove("hide");
 $("modal").innerHTML=`<div class="gm"><div class="gtop"><button class="back" onclick="pauseG()">❚❚</button><div id="gi"></div></div><canvas id="cv" width="320" height="480"></canvas><div class="ctl"><button id="bl">←</button><button id="br">→</button><button id="bj">↑</button></div><div id="qo" class="qo hide"></div></div>`;
 const hold=(id,k)=>{const e=$(id);e.onpointerdown=()=>G.keys[k]=1;e.onpointerup=e.onpointerleave=()=>G.keys[k]=0};hold("bl","l");hold("br","r");$("bj").onpointerdown=jump;
 gi();loop()}
function jump(){if(G&&G.gr&&!G.pause){G.vy=-9.5;sfx.jump()}}
addEventListener("keydown",e=>{if(!G||!G.run)return;if(e.key=="ArrowLeft")G.keys.l=1;if(e.key=="ArrowRight")G.keys.r=1;if(e.key=="ArrowUp"||e.key==" ")jump()});
addEventListener("keyup",e=>{if(!G)return;if(e.key=="ArrowLeft")G.keys.l=0;if(e.key=="ArrowRight")G.keys.r=0});
const gi=()=>{const e=$("gi");if(e)e.innerHTML=`<b>⭐ ${ok}/5</b> · Level ${cur} · 🪙 ${G.coin} · ${"❤️".repeat(G.hearts)}${"🖤".repeat(3-G.hearts)}`};
function step(){const g=G;g.x=Math.max(14,Math.min(306,g.x+(g.keys.r-g.keys.l)*2.8));g.vy+=.45;const py=g.y;g.y+=g.vy;g.gr=0;
 if(g.vy>=0)g.L.forEach((l,k)=>{if(g.x>l[0]-6&&g.x<l[0]+l[2]+6&&py<=l[1]+1&&g.y>=l[1]){g.y=l[1];g.vy=0;g.gr=1;g.ledge=k;
  if(k>=1&&!g.asked[k]){g.asked[k]=1;g.pause=1;g.keys.l=g.keys.r=0;ask()}}});
 if(g.y>520){const l=g.L[g.ledge];g.x=l[0]+25;g.y=l[1]-40;g.vy=0}   // jatuh -> respawn di checkpoint terakhir
 g.I.forEach(t=>{if(!t[3]&&Math.hypot(t[0]-g.x,t[1]-(g.y-16))<20){t[3]=1;t[2]=="o"?g.coin+=2:g.col++;sfx.coin();gi()}})}
function draw(){const c=$("cv");if(!c)return;const x=c.getContext("2d"),g=G;x.clearRect(0,0,320,480);T++;
 [[0,80,1],[1,170,.7],[2,270,.9],[3,370,.6]].forEach(([i,cy,s])=>{const cx=((T*.3*s+i*115)%440)-70;x.fillStyle="#ffffffdd";[[0,0,20],[18,-9,17],[38,0,20],[19,6,18]].forEach(([a,b,r])=>{x.beginPath();x.arc(cx+a*s,cy+b*s,r*s,0,7);x.fill()})});
 x.fillStyle="#ffffffcc";x.fillRect(10,8,300,34);x.fillStyle="#16335f";x.font="bold 15px sans-serif";x.fillText("Kumpulkan semua bentuk!  ▲ ■ ●  "+g.col+"/3",20,30);
 g.L.forEach((l,k)=>{x.fillStyle="#8a5a2b";x.fillRect(l[0],l[1],l[2],26);x.fillStyle="#5fc24a";x.fillRect(l[0],l[1],l[2],8);
  if(k){x.fillStyle="#e33";x.fillRect(l[0]+l[2]-14,l[1]-26,3,26);x.fillRect(l[0]+l[2]-11,l[1]-26,12,9);x.fillStyle="#16335f";x.font="bold 12px sans-serif";x.fillText(g.asked[k]?"✓":k,l[0]+l[2]-10,l[1]-8)}});
 g.I.forEach(t=>{if(t[3])return;const [a,b,k]=t;if(k=="o"){x.fillStyle="#ffc400";x.beginPath();x.arc(a,b+Math.sin(T/10+a)*3,8,0,7);x.fill();x.fillStyle="#fff8";x.beginPath();x.arc(a-2,b-2+Math.sin(T/10+a)*3,3,0,7);x.fill()}
  else if(k=="t"){x.fillStyle="#e94b4b";x.beginPath();x.moveTo(a,b-12);x.lineTo(a+12,b+10);x.lineTo(a-12,b+10);x.fill()}
  else if(k=="s"){x.fillStyle="#3b7cff";x.fillRect(a-11,b-11,22,22)}else{x.fillStyle="#e33a8f";x.beginPath();x.arc(a,b,11,0,7);x.fill()}});
 x.drawImage(HI,g.x-22,g.y-42,44,42)}
function loop(){if(!G||!G.run)return;if(!G.pause)step();draw();requestAnimationFrame(loop)}
function pauseG(){G.pause=1;$("qo").classList.remove("hide");$("qo").innerHTML=`<div class="card" style="width:100%;text-align:center"><h2>Permainan dijeda</h2><button class="go" onclick="resumeG()">Lanjut bermain</button><button class="btn g" style="width:100%" onclick="this.textContent=toggleSound()?'🔇 Suara: OFF':'🔊 Suara: ON'">${mute?"🔇 Suara: OFF":"🔊 Suara: ON"}</button><button class="btn g" style="width:100%" onclick="G.run=0;detail(cur)">Kembali ke detail level</button></div>`}
function resumeG(){$("qo").classList.add("hide");if(qi<5&&!$("qo").innerHTML.includes("Soal"))G.pause=0}
function ask(){const q=Q[qi];$("qo").classList.remove("hide");$("qo").innerHTML=`<div class="card" style="width:100%"><small>Soal ${qi+1}/5</small><h2>${q[0]}</h2><div class="og">${shuf(q.slice(1)).map((o,k)=>`<button class="opt c${k}" data-v="${o}" onclick="pick(this)">${o}</button>`).join("")}</div><div id="fb" style="margin-top:8px"></div></div>`}
function pick(b){const q=Q[qi],right=b.dataset.v==q[1];
 document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.v==q[1])x.classList.add("ok")});
 if(right){ok++;sfx.ok()}else{sfx.no();b.classList.add("no");G.hearts=Math.max(0,G.hearts-1)}
 $("fb").innerHTML=right?"🎉 <b>Benar!</b> +100 poin":`Belum tepat. Jawaban benar: <b>${q[1]}</b>. Tidak apa-apa, coba lagi!`;
 setTimeout(()=>{qi++;gi();$("qo").classList.add("hide");if(qi>=5)fin();else G.pause=0},1500)}
// ===== HASIL LEVEL =====
function fin(){G.run=0;const st=ok>=5?3:ok>=4?2:ok>=3?1:0,score=ok*100+G.col*10,coin=ok*10+G.coin,xp=ok*20,gem=st==3?5:0,old=S.lv[cur];
 if(st>0){S.lv[cur]=Math.max(old||0,st);if(st==3&&old!=3&&S.mis<3)S.mis++}
 S.xp+=xp;st?sfx.win():sfx.no();S.star+=coin;S.gem+=gem;save();
 $("modal").innerHTML=`<div class="dt"><div class="big" style="font-size:56px">${st?"⭐".repeat(st):"💪"}</div><div class="ttl">${st?"Level Selesai!":"Coba Lagi!"}</div><img src="${IMG["27_triangle_hero_map_crop.png"]}" class="hero"><div class="card"><div class="row"><div class="badge">⭐ Skor<br><b>${score}</b></div><div class="badge">🪙 Koin<br><b>${coin}</b></div><div class="badge">XP<br><b>+${xp}</b></div><div class="badge">💎<br><b>+${gem}</b></div></div><p style="margin-top:8px">✅ Jawaban: <b>${ok} benar / 5</b></p>${st?"":"<p>Butuh minimal 3 jawaban benar untuk lanjut.</p>"}</div><button class="go" onclick="${st&&cur<30?`detail(${cur+1})`:"closeM()"}">Lanjutkan</button><button class="btn g" style="width:100%" onclick="explore()">⟳ Ulangi</button></div>`}
render();addEventListener("resize",()=>tab=="map"&&render());
</script></body></html>
